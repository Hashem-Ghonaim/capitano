<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعديل فاتورة شراء #{{ order.id }}</title>
    <link rel="icon" type="image/x-icon" href="/static/uploads/{{ company_logo }}">
    <link rel="shortcut icon" href="/static/uploads/{{ company_logo }}">
    <meta property="og:image" content="https://capitano-eg.vercel.app/static/uploads/{{ company_logo }}">
    <meta property="og:title" content="كابيتانو | Capitano">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, sans-serif; }</style>
</head>
<body class="p-4">

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold text-primary"><i class="fas fa-edit"></i> تعديل فاتورة شراء #{{ order.id }}</h3>
        <a href="/purchases/{{ order.id }}" class="btn btn-secondary">إلغاء وعودة</a>
    </div>

    <form method="POST" class="card shadow-sm border-0">
        <div class="card-body">
            <div class="row mb-4">
                <div class="col-md-4">
                    <label class="form-label fw-bold">المورد</label>
                    <select name="supplier_id" class="form-select">
                        {% for supp in suppliers %}
                        <option value="{{ supp.id }}" {% if supp.id == order.supplier_id %}selected{% endif %}>{{ supp.name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-bordered text-center align-middle">
                    <thead class="table-light">
                        <tr>
                            <th width="40%">اسم المنتج</th>
                            <th width="20%">تلفة الشراء (للقطعة)</th>
                            <th width="20%">الكمية</th>
                            <th width="10%">حذف</th>
                        </tr>
                    </thead>
                    <tbody id="itemsTable">
                        {% for item in order.items %}
                        <tr>
                            <td>
                                <input type="text" name="name[]" class="form-control" value="{{ item.variant.model.name if item.variant else 'منتج محذوف' }}" readonly style="background-color: #e9ecef;">
                            </td>
                            <td>
                                <input type="number" step="0.5" name="cost[]" class="form-control" value="{{ item.unit_cost }}" required>
                            </td>
                            <td>
                                <input type="number" name="qty[]" class="form-control" value="{{ item.quantity }}" required>
                            </td>
                            <td>
                                <button type="button" class="btn btn-danger btn-sm" onclick="this.closest('tr').remove()"><i class="fas fa-trash"></i></button>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            
            <div class="alert alert-warning small">
                <i class="fas fa-info-circle"></i> ملاحظة: التعديل هنا يؤثر على الكميات والأسعار للمنتجات الموجودة في الفاتورة فقط. لإضافة منتج جديد تماماً، يفضل عمل فاتورة شراء جديدة.
            </div>

            <div class="text-end">
                <button type="submit" class="btn btn-primary fw-bold px-5">حفظ التعديلات</button>
            </div>
        </div>
    </form>
</div>

</body>
</html>
